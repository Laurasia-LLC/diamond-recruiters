name: Build and deploy to all-inkl

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # Warns but does not block, so you can ship a staging pass while the
      # real company details are still being gathered. Flip to a hard failure
      # (remove `continue-on-error`) once the site is live for good.
      - name: Check for placeholder content
        run: npm run check:placeholders
        continue-on-error: true

      - name: Deploy to all-inkl over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Never touch the live mail credentials or anything uploaded
          # outside the build.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config.php

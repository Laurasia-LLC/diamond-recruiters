name: Build and deploy

on:
  push:
    branches: [main]

  # Daily rebuild. The site is static, but validThrough is evaluated at BUILD
  # time — so a rebuild is what actually retires an expired posting: it strips
  # the JobPosting schema, adds noindex and drops the role from the sitemap.
  # Without this, a role would sit in Google's feed with stale schema long
  # after it closed, which damages trust in the whole domain's postings.
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate and publish
    runs-on: ubuntu-latest

    # GitHub does NOT allow the `secrets` context inside a step-level `if:`.
    # Resolving it once here — where secrets ARE permitted — gives both Indexing
    # API steps something legal to test. Referencing secrets directly in an `if:`
    # is not a runtime error but a parse error, so it fails the ENTIRE workflow
    # before any step runs, which reads as a deploy failure with no deploy log.
    env:
      HAS_INDEXING_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # Hard gate. A malformed JobPosting is worse than no JobPosting, because
      # Google judges the domain's whole feed on it.
      - name: Validate JobPosting structured data
        run: npm run validate:schema

      # Warns rather than blocks, so a staging deploy is still possible while
      # the real company details are being gathered. Remove continue-on-error
      # once the site is live for good.
      - name: Check for placeholder content
        run: npm run check:placeholders
        continue-on-error: true

      # FTP-Deploy-Action died with "read ECONNRESET (data socket)" on both
      # v4.3.5 and v4.4.0 — its TLS data channel does not survive against this
      # server, and it never printed where it was writing. lftp brings its own
      # TLS and retry handling, and the `pwd; ls` below makes the one thing we
      # could not see explicit: which directory this account actually lands in.
      #
      # NOTE: deliberately no --delete on the mirror. FTP_REMOTE_DIR is '/', and
      # until a green run proves that resolves to the domain folder rather than
      # the shared webspace root, a delete could wipe the other 14 domains on
      # this account. Add --delete only once the first deploy is verified.
      # Its absence is also why api/config.php on the server is safe: mirror
      # only ever uploads what exists locally, and that file does not.
      # FTP_REMOTE_DIR is deliberately NOT used. Whether '/' means the domain
      # folder or the shared webspace root depends on how the FTP user was
      # created in KAS, that is invisible from here, and guessing it wrong is
      # what left the site empty through five runs. The target is detected
      # below instead, so the deploy cannot be broken by that setting again.
      - name: Deploy to all-inkl over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # ssl-force keeps the whole session encrypted, control and data.
          # Certificate verification is off because shared-hosting FTPS
          # certificates are issued for the platform, not for this account's
          # hostname — an unverified cert here was a likely part of the reset.
          SETTINGS='set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30;'

          lftp_do() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "$SETTINGS $1 bye"
          }

          echo "::group::Where this account lands"
          LANDING="$(lftp_do 'cls -1;')"
          printf '%s\n' "$LANDING"
          echo "::endgroup::"

          # A user restricted to the domain folder lands INSIDE it and therefore
          # cannot see a 'diamond-recruiters.com' entry. A user rooted at the
          # shared webspace can. That difference is what picks the target.
          if printf '%s\n' "$LANDING" | grep -q 'diamond-recruiters\.com'; then
            TARGET='/diamond-recruiters.com/'
            echo "Account is rooted at the shared webspace -> uploading to $TARGET"
          else
            TARGET='/'
            echo "Account is restricted to the domain folder -> uploading to $TARGET"
          fi

          echo "::group::Mirror dist/ to $TARGET"
          lftp_do "mirror --reverse --verbose --parallel=4 ./dist/ '$TARGET';"
          echo "::endgroup::"

          echo "::group::Result"
          lftp_do "cls -l '$TARGET';"
          echo "::endgroup::"

      # Remembers which postings have already been pushed, so unchanged roles
      # do not burn the 200/day Indexing API quota on every run.
      - name: Restore Indexing API state
        if: env.HAS_INDEXING_KEY == 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: indexing-state-${{ github.run_id }}
          restore-keys: indexing-state-

      # Pushes new and newly-closed roles straight to Google rather than
      # waiting for a sitemap crawl. Skipped silently until the secret is set.
      - name: Notify Google Indexing API
        if: env.HAS_INDEXING_KEY == 'true'
        run: npm run notify:google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SITE_URL: https://diamond-recruiters.com
